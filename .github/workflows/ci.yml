name: CI build

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

defaults:
  run:
    working-directory: red-rising

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4.4.0

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            pkg-config \
            libwayland-dev \
            libudev-dev \
            libasound2-dev \
            libx11-dev \
            libxkbcommon-dev \
            libxkbcommon-x11-dev

      - name: Cache cargo registry and target
        uses: Swatinem/rust-cache@v2.9.2
        with:
          workspaces: red-rising
          cache-on-failure: true

      - name: cargo fmt --check
        run: cargo fmt --check

      - name: cargo build
        run: cargo build

      - name: cargo test
        run: cargo test

      - name: cargo clippy
        run: cargo clippy --all-targets --all-features -- -D warnings
